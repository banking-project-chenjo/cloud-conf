server.port=8085

# Eureka configuration
eureka.client.service-url.defaultZone=http://bank-registry-service:8761/eureka/

# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url = jdbc:postgresql://postgres-db:5432/employer_db
spring.datasource.username = prosper
spring.datasource.password = prosper
spring.datasource.driver-class-name = org.postgresql.Driver

# JPA configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


# application.properties
conge.service.add.employer.url=http://localhost:8084/conge-employer/add
conge.service.add.rh.url=http://localhost:8084/conge-rh/add


spring.rabbitmq.host=rabbitmq-broker
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


admin.name = ADMIN
admin.password = ADMIN

# Configuration de base de Springdoc
springdoc.swagger-ui.path=/swagger-ui.html

# Informations générales sur l'API (ce qui apparaît en haut de la page Swagger)
springdoc.info.title=ERP Project API - Employer Service
springdoc.info.version=1.0.0
springdoc.info.description=Documentation des routes du microservice de gestion des Employés et RH.


spring.web.cors.allowed-origins=http://11.11.11.207:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
