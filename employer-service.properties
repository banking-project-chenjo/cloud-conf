server.port=8085

# Eureka configuration
# eureka.client.service-url.defaultZone=http://bank-registry-service:8761/eureka/
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database configuration
# spring.datasource.url=jdbc:mysql://mysql-db:3306/user_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root
spring.datasource.url = jdbc:postgresql://localhost:5432/employer_db
spring.datasource.username = prosper
spring.datasource.password = prosper
spring.datasource.driver-class-name = org.postgresql.Driver

# JPA configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


# application.properties
conge.service.add.employer.url=http://localhost:8084/conge-employer/add
conge.service.add.rh.url=http://localhost:8084/conge-rh/add


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


admin.name = ADMIN
admin.password = ADMIN

# Configuration de base de Springdoc
springdoc.swagger-ui.path=/swagger-ui.html

# Informations générales sur l'API (ce qui apparaît en haut de la page Swagger)
springdoc.info.title=ERP Project API - Employer Service
springdoc.info.version=1.0.0
springdoc.info.description=Documentation des routes du microservice de gestion des Employés et RH.

springdoc.data-rest.auto-merge=false
springdoc.model-and-view-allowed=false
springdoc.default-flat-param-object=true
# application.properties

# Niveau général de débogage pour Spring Boot
logging.level.org.springframework.web=DEBUG

# Niveau de débogage pour les composants Springdoc/OpenAPI
logging.level.org.springdoc=DEBUG
logging.level.io.swagger.v3=DEBUG

# Ceci est utile pour voir les détails de sérialisation par Jackson (qui est à l'origine du 500)
logging.level.com.fasterxml.jackson=DEBUG

