server.port = 8081

eureka.client.service-url.defaultZone =  http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true



# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom Exchange and Routing Key for User Events
user.rabbitmq.exchange.name=user-exchange
user.rabbitmq.routing.key=user.created



spring.datasource.url = jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true
spring.datasource.username =prosper
spring.datasource.password =prosper
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show.sql = true


spring.jpa.hibernate.ddl-auto=update